{% extends "base.html" %}

{% block title %}Admin Portal - RollCall{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shadow-lg shadow-indigo-500/10">
                    <i class="fa-solid fa-server text-xl"></i>
                </div>
                <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 border border-indigo-500/40 text-indigo-400 flex items-center justify-center shadow-xl shadow-black/50 ring-4 ring-indigo-500/20">
                    <i class="fa-solid fa-user-shield text-2xl text-cyan-400"></i>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shadow-lg shadow-cyan-500/10">
                    <i class="fa-solid fa-fingerprint text-xl"></i>
                </div>
            </div>

            <h1 class="text-3xl font-extrabold text-white tracking-tight">Admin Portal</h1>
            <p class="text-sm text-slate-400 mt-1">Authorized instructors & administrators authentication.</p>
        </div>

        <!-- Login Form Card -->
        <div class="cyber-glass rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-500"></div>

            <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
                
                <!-- Username -->
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center gap-2">
                        <i class="fa-regular fa-user text-cyan-400"></i>
                        <span>Admin Username</span>
                    </label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter authorized username"
                           class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all shadow-inner">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center gap-2">
                        <i class="fa-solid fa-key text-cyan-400"></i>
                        <span>Password</span>
                    </label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••"
                           class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all shadow-inner">
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                            class="w-full py-4 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-extrabold rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-150 flex items-center justify-center gap-2 border border-indigo-400/30 text-sm uppercase tracking-wider">
                        <i class="fa-solid fa-right-to-bracket text-sm"></i>
                        <span>Secure Log In</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="mt-6 text-center">
            <a href="{{ url_for('index') }}" class="text-xs font-semibold text-slate-400 hover:text-indigo-400 transition-colors inline-flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Student Attendance Form</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
